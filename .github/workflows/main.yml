
name: Friend Ludo Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o Friend-Ludo-Android-Project.zip -d project
          echo "Project files:"
          find project -maxdepth 5 -type f | head -200

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Friend-Ludo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
