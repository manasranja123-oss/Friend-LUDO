
name: Friend Ludo Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          if [ ! -f "Friend-Ludo-Android-Project.zip" ]; then
            echo "::error::Friend-Ludo-Android-Project.zip not found in repository root."
            exit 1
          fi
          unzip -o Friend-Ludo-Android-Project.zip -d project
          find project -name settings.gradle.kts -print

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR="$(find project -name settings.gradle.kts -printf '%h\n' | head -1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text()

          java_block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          kotlin_block = """kotlinOptions {
                  jvmTarget = "17"
              }"""

          # Replace existing Java compile options, or add them if missing.
          if re.search(r'\bcompileOptions\s*\{[^}]*\}', content, re.S):
              content = re.sub(
                  r'\bcompileOptions\s*\{[^}]*\}',
                  java_block,
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content, count = re.subn(
                  r'\bandroid\s*\{',
                  lambda m: m.group(0) + '\n    ' + java_block,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Could not find android { block.")

          # Replace existing Kotlin options, or add them if missing.
          if re.search(r'\bkotlinOptions\s*\{[^}]*\}', content, re.S):
              content = re.sub(
                  r'\bkotlinOptions\s*\{[^}]*\}',
                  kotlin_block,
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content, count = re.subn(
                  r'\bandroid\s*\{',
                  lambda m: m.group(0) + '\n    ' + kotlin_block,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("Could not add Kotlin JVM target.")

          path.write_text(content)
          print("Updated build.gradle.kts:")
          print(content)
          PY

      - name: Build Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Friend-Ludo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
